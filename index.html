<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hero Greetings</title>
<meta name="description" content="ברכות וידאו מגיבורי-על מקוריים">
<style>
  html,body{margin:0;height:100%;background:#fff7e6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #soon{display:none;height:100%;align-items:center;justify-content:center;text-align:center;padding:0 16px;color:#5a3a00}
  #soon h1{font-size:2rem;margin:0 0 .5rem}
</style>
</head>
<body>
<!-- hero.akeyo.io stays in the address bar; the app itself is served by the API host over TLS -->
<div id="soon"><div><h1>🦸 ברכות גיבורים</h1><p>האפליקציה עולה בקרוב, נסו שוב עוד מעט</p></div></div>
<script>
  const APP = "https://167-233-31-223.sslip.io/";
  fetch(APP + "api/health", {mode: "no-cors", cache: "no-store"})
    .then(() => {
      const f = document.createElement("iframe");
      f.src = APP; f.title = "Hero Greetings";
      f.allow = "autoplay; clipboard-write; web-share; fullscreen";
      document.body.appendChild(f);
    })
    .catch(() => { document.getElementById("soon").style.display = "flex"; });
</script>
</body>
</html>
